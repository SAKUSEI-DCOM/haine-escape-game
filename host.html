<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>這音さん専用｜12時間監禁部屋</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🔒 這音さん専用・監禁部屋</h1><div class="row"><span id="roomBadge"></span><button class="secondary hidden" id="copy">コピー</button></div></header><main id="main"><section class="hero" id="home"><div class="big">12時間監禁部屋</div><p>10桁の暗号を解いて、罰ゲームを回避せよ。</p><button id="start">ゲームを始める</button></section><section class="hero hidden" id="intro"><h2>プロローグ</h2><div class="intro" id="introText"></div><button id="enter">監禁部屋に進む</button></section><div id="game" class="layout hidden"><section><div class="panel"><h2>👥 参加中のリスナー <span id="peopleCount">0</span>人</h2><div id="people"></div></div></section><section><div class="panel center"><div class="tag">脱出までの残り時間</div><div id="timer" class="timer">12:00</div><div class="tag">時 : 分</div></div><div class="panel center"><h2>10桁のパスワードを入力</h2><input class="answer" id="answer" maxlength="10" placeholder="パスワード" autocomplete="off"><button id="submit">回答する</button><div id="checking" class="hidden warning">🔍 検証中……</div></div><div class="panel center"><h2>残りの回答数</h2><div class="count" id="attempts">3</div><p class="tag">30分ごとに1回復（最大100回）</p></div><div class="panel center" id="sabotageBox"><h2>妨害状況</h2><p id="sabotageText">妨害なし</p><button id="endSab" class="hidden">閉じる</button></div></section><section><div class="panel"><h2>🎯 ミッション</h2><p class="tag">配信で達成したらクリアを押す。一度押すと戻せません。</p><div id="missions"></div></div></section></div></main><div id="toast"></div><div id="modal" class="hidden"></div><div id="performanceLock" class="performance-lock hidden" role="dialog" aria-modal="true" aria-labelledby="performanceTitle"><div class="performance-card"><div class="performance-icon">🔒 妨害発動 🔒</div><h2 id="performanceTitle">では這音さん一発芸をしてください</h2><p>「閉じる」を押すまで、ほかの操作はできません。</p><button id="closePerformance" type="button">閉じる</button></div></div><div id="redOverlay" class="redOverlay hidden">アホネー</div><script type="module" src="host.js"></script></body></html>
